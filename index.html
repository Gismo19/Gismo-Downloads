<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Gismo02 Downloads</title>
<style>
  html, body {
    background-color: #111111;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .modrinth-popup {
    background-color: #1c1c1c;
    border: 1px solid #2d2d2d;
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    box-sizing: border-box;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid #2d2d2d;
    padding-bottom: 15px;
  }
  .title-area {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: bold;
  }

  .select-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    margin-top: 15px;
  }
  select {
    flex: 1;
    background-color: #252525;
    color: white;
    border: 1px solid #3d3d3d;
    padding: 12px;
    font-size: 15px;
    border-radius: 8px;
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
  }

  .main-release-box {
    display: none; 
    background-color: #141414;
    border-radius: 10px;
    padding: 16px;
    justify-content: space-between;
    align-items: center;
  }
  .version-num { font-weight: bold; font-size: 18px; }
  .release-badge {
    background-color: #00381c;
    color: #00af5c;
    font-size: 12px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 12px;
    margin-left: 8px;
  }
  .size-info { color: #888; font-size: 13px; margin-top: 6px; }
  
  .download-btn {
    background-color: #00af5c;
    color: #111111;
    padding: 12px 24px;
    font-weight: bold;
    border-radius: 10px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    cursor: pointer;
    border: none;
  }
  .download-btn:hover { background-color: #00cd6c; }
</style>
</head>
<body>

  <div class="modrinth-popup">
    <div class="header-row">
      <div class="title-area"><span>DOWNLOAD SKBEE</span></div>
    </div>

    <div class="select-row">
      <select id="versionSelect" onchange="updateDownload()">
        <option value="" selected>Version wählen</option>
        <option value="26.3">26.3</option>
        <option value="26.2">26.2</option>
        <option value="26.1.2">26.1.2</option>
        <option value="26.1">26.1</option>
      </select>
      <select disabled><option value="paper">Paper</option></select>
    </div>

    <div id="dlBox" class="main-release-box">
      <div>
        <div><span class="version-num">3.26.0</span><span class="release-badge">Release</span></div>
        <div class="size-info">2.48 MiB</div>
      </div>
      <!-- Zwingt den Browser auf derselben Seite den Drive-Download zu starten -->
      <button id="dlButton" class="download-btn" onclick="startDirectDownload()">Download</button>
    </div>
  </div>

<script>
// Hier ist dein funktionierender Google-Drive-Link hinterlegt
const downloadUrl = "https://google.com";

function updateDownload() {
  const select = document.getElementById("versionSelect");
  const dlBox = document.getElementById("dlBox");
  if (select.value !== "") {
    dlBox.style.display = "flex";
  } else {
    dlBox.style.display = "none";
  }
}

function startDirectDownload() {
  const a = document.createElement('a');
  a.href = downloadUrl;
  a.target = '_self'; // Bleibt im selben Tab, öffnet keine neue Seite!
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>
</body>
</html>
